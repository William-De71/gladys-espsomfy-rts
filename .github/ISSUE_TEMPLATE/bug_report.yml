name: Bug report
description: Something does not work as described in the documentation.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a problem. The **Search the controllers** button of the configuration often tells where it stops: paste its message below.
  - type: input
    id: gladys-version
    attributes:
      label: Gladys version
      description: Settings → System.
      placeholder: '5.2.1'
    validations:
      required: true
  - type: input
    id: integration-version
    attributes:
      label: Integration version
      description: Integrations → ESPSomfy RTS, Supervision tab.
      placeholder: '0.1.0'
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Controller and shade
      description: The firmware version of the ESPSomfy RTS controller (its web page, top right) and the type of the shade (roller, awning, blind with tilt, gate…).
      placeholder: 'v2.4.7, awning with a sun sensor'
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened, and what you expected
      description: Does the shade work from the web page of the controller? Is the controller on the same network as Gladys?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: |
        Logs of the integration (Logs tab of the integration page), ideally with the SDK debug logs: add the environment variable `DEBUG=gladys-integration-sdk` to the container, reproduce, then copy the lines.
      render: text
