<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="640" viewBox="0 0 1000 640" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
  <title>Discovery, creation, command and state cycle of the ESPSomfy RTS integration (illustration)</title>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#46505a"/>
    </marker>
  </defs>
  <rect width="1000" height="640" fill="#ffffff"/>
  <text x="980" y="632" text-anchor="end" font-size="12" fill="#8a949e">illustration</text>
  <g font-size="15" font-weight="700" text-anchor="middle" fill="#24303c">
    <rect x="30" y="20" width="140" height="36" rx="8" fill="#eef4fb" stroke="#2979d6"/><text x="100" y="44">User</text>
    <rect x="230" y="20" width="140" height="36" rx="8" fill="#eef4fb" stroke="#2979d6"/><text x="300" y="44">Gladys</text>
    <rect x="430" y="20" width="140" height="36" rx="8" fill="#f4f6f8" stroke="#46505a"/><text x="500" y="44">Integration</text>
    <rect x="630" y="20" width="140" height="36" rx="8" fill="#f0f7f1" stroke="#2e8b57"/><text x="700" y="44">Controller</text>
    <rect x="830" y="20" width="140" height="36" rx="8" fill="#fff6e8" stroke="#d48a1c"/><text x="900" y="44">Somfy motor</text>
  </g>
  <g stroke="#c4ccd4" stroke-dasharray="4 4">
    <line x1="100" y1="56" x2="100" y2="610"/><line x1="300" y1="56" x2="300" y2="610"/>
    <line x1="500" y1="56" x2="500" y2="610"/><line x1="700" y1="56" x2="700" y2="610"/>
    <line x1="900" y1="56" x2="900" y2="610"/>
  </g>
  <g stroke="#46505a" stroke-width="1.6" marker-end="url(#a)">
    <line x1="100" y1="90" x2="296" y2="90"/>
    <line x1="300" y1="120" x2="496" y2="120"/>
    <line x1="500" y1="150" x2="304" y2="150"/>
    <line x1="300" y1="180" x2="496" y2="180"/>
    <line x1="500" y1="210" x2="696" y2="210"/>
    <line x1="700" y1="240" x2="504" y2="240"/>
    <line x1="500" y1="270" x2="304" y2="270"/>
    <line x1="100" y1="310" x2="296" y2="310"/>
    <line x1="300" y1="340" x2="496" y2="340"/>
    <line x1="500" y1="370" x2="696" y2="370"/>
    <line x1="700" y1="400" x2="504" y2="400"/>
    <line x1="100" y1="450" x2="296" y2="450"/>
    <line x1="300" y1="480" x2="496" y2="480"/>
    <line x1="500" y1="510" x2="696" y2="510"/>
    <line x1="700" y1="540" x2="896" y2="540"/>
    <line x1="700" y1="570" x2="504" y2="570"/>
    <line x1="500" y1="600" x2="304" y2="600"/>
  </g>
  <g font-size="13" fill="#24303c">
    <text x="110" y="84">Discover tab: Scan</text>
    <text x="310" y="114">scan request</text>
    <text x="310" y="144">scanNetwork: SSDP M-SEARCH ssdp:all</text>
    <text x="310" y="174">raw answers (kept: SERVER … ESPSomfyRTS)</text>
    <text x="510" y="204">GET :8081/discovery</text>
    <text x="510" y="234">server id, shades, groups, rooms</text>
    <text x="310" y="264">discovered shades and groups</text>
    <text x="110" y="304">Discover tab: Add</text>
    <text x="310" y="334">device created</text>
    <text x="510" y="364">socket :8080 (open since the search)</text>
    <text x="510" y="394">states of the shade, then each change</text>
    <text x="110" y="444">sets the position to 30 %</text>
    <text x="310" y="474">setValue(position, 30)</text>
    <text x="510" y="504">PUT /shadeCommand { target: 70 } (70 % down)</text>
    <text x="710" y="534">RTS radio frames</text>
    <text x="510" y="564">shadeState while it moves (remotes too)</text>
    <text x="310" y="594">states (changes only)</text>
  </g>
</svg>
